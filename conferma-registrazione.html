<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CORE-54 - Email confermata</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0B0F14;
    color: #E8EDF2;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 420px;
    width: 100%;
    background: #131924;
    border: 1px solid #232B38;
    border-radius: 20px;
    padding: 40px 32px;
    text-align: center;
  }
  .check {
    width: 64px;
    height: 64px;
    margin: 0 auto 24px;
    border-radius: 50%;
    background: rgba(16, 185, 129, 0.15);
    border: 1px solid #10B981;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .check svg { width: 32px; height: 32px; }
  h1 {
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 12px;
    letter-spacing: -0.3px;
  }
  p {
    font-size: 15px;
    line-height: 1.5;
    color: #9AA5B1;
    margin-bottom: 8px;
  }
  .brand {
    margin-top: 32px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: #4A5568;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="check">
      <svg viewBox="0 0 24 24" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>
    <h1>Email confermata</h1>
    <p>Il tuo account CORE-54 e' stato attivato con successo.</p>
    <p>Torna nell'app e accedi con la tua email e password per iniziare.</p>
    <div class="brand">CORE-54</div>
  </div>
</body>
</html>
